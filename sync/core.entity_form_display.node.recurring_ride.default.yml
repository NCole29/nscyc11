      format_settings:
        classes: ''
        show_empty_fields: false
        id: ''
        label_as_html: false
        open: true
        description: "<details class=\"info-details\">\r\n<summary>HOW TO ADD AND EDIT RECURRING DATES</summary>\r\n<p><strong>Start date/time:</strong> The ride page displays the start date and time. The end time is hidden unless changed to differ from the start.</p>\r\n<p><strong>Assigning different start times to different dates?</strong> Save the ride to generate the series of dates in the database. Then edit the ride and click <strong>MANAGE INSTANCES</strong> to \"Override\" and change the time for specific dates.</p>\r\n<p><strong>Excluding specific dates from the series?</strong> After saving and editing the ride, click <strong>MANAGE INSTANCES</strong> to \"Override\" and \"Remove instance\" for specific dates. </p>\r\n\r\n<em>A second date field appears after the page is saved and edited. Leave the second date field empty unless there is a significant gap between dates in the series.</em>\r\n</details>"
