          admin_label: ''
          plugin_id: text_custom
          empty: false
          content: "<details class=\"info-details\">\r\n<summary>Files vs. Media Items</summary>\r\n<p>Every uploaded item appears in two different lists under the Content tab:\r\n<ul>\r\n<li><strong>File:</strong> The actual physical file (e.g., invoice.pdf or hero-banner.jpg) stored on the server.</li>\r\n<li><strong>Media Item:</strong> The Drupal record that points to the physical file. It controls how and where the item is displayed on the the website. </li>\r\n</ul>\r\nBoth lists display the same information so you can match a media item to its physical file. However, <strong>\"delete\" links behave differently.</strong> The Files list deletes the actual physical file while the Media list deletes the database record.\r\n<p><strong>Checking Media Usage</strong>\r\n<br>Before modifying or deleting an asset, click <strong>Usage count</strong> on the Media page. This shows exactly which web pages display the image or link to the file.</p> \r\n<p><strong>How to Delete Items Safely</strong>\r\n<ol>\r\n<li><strong>Always check \"Usage\" first</strong> to ensure you do not break live content.</li>\r\n<li><strong>Delete the Media item</strong> to remove unused file references from the database. The system will automatically clean up the associated physical file.</li>\r\n<li><strong>Use the Files list</strong> only if you need to bypass the automated cleanup and permanently delete the physical file immediately.</li>\r\n</details>\r\n<hr>"
          tokenize: false
        result:
          id: result
          table: views
          field: result
          relationship: none
          group_type: group
          admin_label: ''
          plugin_id: result
          empty: false
          content: "Usage reflects the generation of thumbnails (displayed here) in addition to web page displays.\r\n<p>Displaying @start - @end of @total</p>"
      display_extenders: {  }
      path: admin/content/files
