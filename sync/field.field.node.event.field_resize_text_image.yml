settings:
  markup:
    value: '<p>There are <strong>three </strong>ways to add images to an <strong>Event </strong>page:</p><ol><li data-list-item-id="edbd9a95d135939bbbc319fa4805507aa"><strong>Image </strong>field displays a standard-sized image in two locations:<ul><li data-list-item-id="ef0ef3abdca21b27ad93da6754d5d0d8f">The home page above the “Summary for home page.”</li><li data-list-item-id="ef23fb41e5a0bbb6c16bbcb73a598dd4e">The Event page.</li></ul></li><li data-list-item-id="e263f3688306cc18473a8b71424618b83"><strong>Banner </strong>displays a single image (banner) or three gallery images above the page title.</li><li class="ck-list-marker-bold" data-list-item-id="e4cffa72d54f2a7d6c07caecf2699ab5d"><strong>Text field &nbsp;</strong><ul><li data-list-item-id="e2d1a669958147f3e01591d881ce8a9a4">You can insert images directly into the text editor by clicking the <strong>Insert Media</strong> icon. Once the image is placed, click on it to adjust its size, alignment, and text-wrap settings.</li></ul></li></ol><p>The maximum image file size is <strong>2MB.&nbsp;</strong>Uploading larger files is unnecessary because images are resized automatically for optimal display across various devices.</p><p>Consider the following tools to resize images that are larger than 3MB:</p><ul><li data-list-item-id="e03ca6dc6acd987ff2ba761e2416b60ba"><strong>Mac Users </strong>- Utilize <a href="https://support.apple.com/guide/preview/crop-resize-or-rotate-an-image-prvw2015/mac#:~:text=Reduce%20an%20image&amp;apos;s%20file%20size,value%20in%20the%20Resolution%20field.">Apple''s built-in Preview application</a>.</li><li data-list-item-id="eb349633b2b2dd0a676e59f994f672dd3"><strong>Windows Users </strong>- Install and use the <a href="https://apps.microsoft.com/detail/xp89dcgq3k6vld?hl=en-US&amp;gl=US">Microsoft PowerToys Image Resizer utility</a> (learn more about it <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">here)</a>.</li></ul><p>When resizing, the recommended setting is "Large" (fits within 1920 x 1080 pixels).&nbsp;</p>'
    format: basic_html
