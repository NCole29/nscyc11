$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: pcard
description: Paragraph card
props:
  type: object
  properties:
    title:
      type: string
      title: Heading
      examples:
        - Section title
    shaded:
      title: Shaded
      type: string
      label: Shade background
      default: "0"
    height:
      title: Full height
      type: string
      default: "0"
    image:
      title: Image
      type: 'string'
      label: The image URL or data.
slots:
  content:
    title: Content
  link:
    title: URL
    type: ['string','null']