
stages:
  - lint
  - test

# =============================================================================
# Drupal Coding Standards (PHPCS)
# Equivalent to .github/workflows/phpcs.yml
# =============================================================================
phpcs:
  stage: lint
  image: php:8.3-cli
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    key: "phpcs-$CI_COMMIT_REF_SLUG"
    paths:
      - .composer-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config --global cache-files-dir "$CI_PROJECT_DIR/.composer-cache"
    - composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
    - composer global require dealerdirect/phpcodesniffer-composer-installer drupal/coder
    - export PATH="$PATH:$(composer global config bin-dir --absolute)"
  script:
    # GitLab uses job exit code for pass/fail; phpcs exits non-zero on violations.
    - phpcs -q --report=full

# =============================================================================
# Integration Tests (PHPUnit)
# Equivalent to .github/workflows/main.yml
# =============================================================================
phpunit:
  stage: test
  image: php:${PHP}-cli
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "4.0.x" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  # Each row runs as SHARD_TOTAL jobs, each running about a third of the
  # test classes (see .gitlab-ci/shard-tests.sh).
  parallel:
    matrix:
      - PHP: "8.3"
        DRUPAL: "10.6.*"
        CIVICRM: "6.16.*"
        CHROMEDRIVER_VERSION: "133.0.6943.126"
        SHARD: ["1", "2", "3"]
      - PHP: "8.4"
        DRUPAL: "10.6.*"
        CIVICRM: "^6.0"
        CHROMEDRIVER_VERSION: "133.0.6943.126"
        SHARD: ["1", "2", "3"]
      - PHP: "8.5"
        DRUPAL: "11.4.*"
        CIVICRM: "6.16.*"
        CHROMEDRIVER_VERSION: "133.0.6943.126"
        SHARD: ["1", "2", "3"]
      - PHP: "8.5"
        DRUPAL: "^11.4"
        CIVICRM: "^6.0"
        CHROMEDRIVER_VERSION: "133.0.6943.126"
        SHARD: ["1", "2", "3"]
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    # The number of values in the matrix SHARD lists.
    SHARD_TOTAL: "3"
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_DATABASE: "db"
    COMPOSER_MEMORY_LIMIT: "-1"
    SIMPLETEST_BASE_URL: "http://127.0.0.1:8080"
    SIMPLETEST_DB: "mysql://root:@mysql/db"
    SIMPLETEST_CIVICRM_DB: "mysql://root:@mysql/db_civicrm"
    SYMFONY_DEPRECATIONS_HELPER: "disabled"
    MINK_DRIVER_ARGS_WEBDRIVER: '["chrome", {"browserName":"chrome","goog:chromeOptions":{"args":["--disable-gpu", "--no-sandbox", "--headless"]}}, "http://127.0.0.1:9515"]'
    BROWSERTEST_OUTPUT_DIRECTORY: "$CI_PROJECT_DIR/browser-output"
  cache:
    key: "phpunit-${PHP}-${DRUPAL}-composer"
    paths:
      - .composer-cache/
  before_script:
    - |
      apt-get update -qq
      apt-get install -y -qq git unzip curl default-mysql-client \
        libpng-dev libxml2-dev libzip-dev libicu-dev libjpeg-dev libwebp-dev libfreetype6-dev libglib2.0-0 libnss3-dev
    - |
      docker-php-ext-configure gd --with-jpeg --with-webp --with-freetype
      docker-php-ext-install pdo pdo_mysql bcmath soap intl gd exif zip mysqli
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config --global cache-files-dir "$CI_PROJECT_DIR/.composer-cache"
    - mysql --skip-ssl -uroot -hmysql -e 'CREATE DATABASE IF NOT EXISTS db_civicrm;'
    - |
      composer create-project drupal/recommended-project:"$DRUPAL" ~/drupal --no-interaction --no-install
      cd ~/drupal
      composer config extra.enable-patching true
      composer config extra.compile-mode all
      composer config minimum-stability dev
      composer config prefer-stable true
      composer config preferred-install dist
      composer config allow-plugins.civicrm/composer-compile-plugin true
      composer config allow-plugins.civicrm/composer-downloads-plugin true
      composer config allow-plugins.civicrm/civicrm-asset-plugin true
      composer config allow-plugins.cweagans/composer-patches true
      composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
      composer config allow-plugins.tbachert/spi true
      composer config audit.block-insecure false
      composer config repositories.0 composer https://packages.drupal.org/8
      composer config repositories.1 path "$CI_PROJECT_DIR"
      composer install --no-interaction
      COMPOSER_MEMORY_LIMIT=-1 composer require "drupal/core-dev:$DRUPAL" sebastian/diff
    - |
      cd ~/drupal
      COMPOSER_MEMORY_LIMIT=-1 composer require \
        composer/installers:'^1.0' \
        civicrm/civicrm-asset-plugin:'~1.1' \
        "civicrm/civicrm-core:$CIVICRM" \
        "civicrm/civicrm-packages:$CIVICRM" \
        "civicrm/civicrm-drupal-8:$CIVICRM" \
        -W
    - |
      cd ~/drupal
      COMPOSER_MEMORY_LIMIT=-1 composer require drupal/civicrm_entity "*@dev"
      # fullcalendar_view 5.3.0 ends two case labels with a semicolon, which
      # PHP 8.5 deprecates. PHP prints the notice when it compiles the file,
      # PHPUnit marks the calendar tests risky for the output, and core's
      # phpunit.xml.dist fails on risky tests.
      composer config --json extra.patches.drupal/fullcalendar_view \
        "{\"PHP 8.5: colons after case labels\": \"$CI_PROJECT_DIR/.gitlab-ci/patches/fullcalendar_view-php85-case-colon.patch\"}"
      COMPOSER_MEMORY_LIMIT=-1 composer require drupal/fullcalendar_view
    - |
      if [ "$CHROMEDRIVER_VERSION" = "latest" ]; then
        apt-get install -y -qq chromium chromium-driver
      else
        # Chrome for Testing: Google's versioned Chrome builds + matching chromedriver.
        CFT="https://storage.googleapis.com/chrome-for-testing-public/$CHROMEDRIVER_VERSION/linux64"
        curl -fsSL --retry 3 -o /tmp/chrome.zip "$CFT/chrome-linux64.zip"
        curl -fsSL --retry 3 -o /tmp/chromedriver.zip "$CFT/chromedriver-linux64.zip"
        unzip -q -o /tmp/chrome.zip -d /opt
        unzip -q -o /tmp/chromedriver.zip -d /opt
        # Install Chrome's runtime libraries from the dependency list shipped in the zip.
        sed -E 's/ *\(.*//; s/ *\|.*//' /opt/chrome-linux64/deb.deps \
          | xargs apt-get install -y -qq --no-install-recommends
        ln -sf /opt/chrome-linux64/chrome /usr/local/bin/google-chrome
        ln -sf /opt/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        google-chrome --version
      fi
      chromedriver --version
      chromedriver --port=9515 &
    - php -S 127.0.0.1:8080 -t ~/drupal/web 2> /dev/null &
  script:
    - mkdir -p "$BROWSERTEST_OUTPUT_DIRECTORY" "$CI_PROJECT_DIR/junit"
    - cd ~/drupal/web
    # Run each test class on fresh databases. CiviCRM's tables are not
    # prefixed and are only dropped when a test tears down cleanly, so one
    # test failing in tearDown would otherwise fail every test after it with
    # "SIMPLETEST_DB contains CiviCRM tables".
    - |
      tests=$(bash "$CI_PROJECT_DIR/.gitlab-ci/shard-tests.sh" "$SHARD" "$SHARD_TOTAL" modules/contrib/civicrm_entity/tests/src)
      if [ -z "$tests" ]; then
        echo "Shard $SHARD of $SHARD_TOTAL has no test classes."
        exit 1
      fi
      echo "Shard $SHARD of $SHARD_TOTAL runs:"
      printf '  %s\n' $tests
      failed=""
      for test in $tests; do
        mysql --skip-ssl -uroot -hmysql -e 'DROP DATABASE IF EXISTS db; CREATE DATABASE db; DROP DATABASE IF EXISTS db_civicrm; CREATE DATABASE db_civicrm;'
        ../vendor/bin/phpunit -c core --log-junit "$CI_PROJECT_DIR/junit/$(basename "$test" .php).xml" "$test" || failed="$failed $test"
      done
      if [ -n "$failed" ]; then
        echo "Failed test classes:"
        printf '  %s\n' $failed
        exit 1
      fi
  after_script:
    # Drupal writes the HTML snapshots to sites/simpletest/browser_output, not
    # to BROWSERTEST_OUTPUT_DIRECTORY.
    - cp -r ~/drupal/web/sites/simpletest/browser_output/. "$CI_PROJECT_DIR/browser-output/" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - browser-output/
    reports:
      junit: junit/*.xml
    expire_in: 1 week
