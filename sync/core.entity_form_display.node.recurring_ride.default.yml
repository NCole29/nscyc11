        - field_ride_picture
      label: 'Ride picture'
      region: content
      parent_name: group_description
      weight: 11
      format_type: details
      format_settings:
        classes: ''
        show_empty_fields: false
        id: ''
        label_as_html: false
        open: true
        description: "<details class=\"info-details\">\r\n<summary>HOW TO ADD A RIDE PICTURE</summary>\r\nClick <strong>Add media</strong> and search for an existing image or upload a new one. \r\n<p>\r\nWhen uploading images:<br>\r\n1) <strong>File size:</strong> Images are capped at 2MB and auto-optimized for display, making larger files unnecessary. If needed, resize images to \"Large\" (max 1920x1080) using Apple Preview (Mac) or <a href=\"https://learn.microsoft.com/en-us/windows/powertoys/image-resizer\">Microsoft PowerToys</a> (Windows).</p\r\n<p>\r\n2)  <strong>Alternative text:</strong> Add a description to make images searchable and easy to re-use.</p>\r\n<p>\r\n3) <strong>Crop:</strong> Click <strong>Crop image</strong> and adjust the frame to ensure a consistent, standard look across all ride pages. </p>\r\n</details>"
        required_fields: true
