settings:
  markup:
    value: '<p>Images can be inserted into the text editors using the <strong>Insert Media</strong> icon. The maximum image file size is <strong>3MB.&nbsp;</strong>Uploading larger files is unnecessary because images are resized automatically for optimal display across various devices.</p><p>Consider the following tools to resize images that are larger than 3MB:</p><ul><li data-list-item-id="ea46330328fa53133693fd95c2de1a160"><strong>Mac Users&nbsp;</strong>- Utilize <a href="https://support.apple.com/guide/preview/crop-resize-or-rotate-an-image-prvw2015/mac#:~:text=Reduce%20an%20image&amp;apos;s%20file%20size,value%20in%20the%20Resolution%20field.">Apple''s built-in Preview application</a>.</li><li data-list-item-id="e324e7da52f82b83d4bdbac0524bdaaa8"><strong>Windows Users&nbsp;</strong>- Install and use the <a href="https://apps.microsoft.com/detail/xp89dcgq3k6vld?hl=en-US&amp;gl=US">Microsoft PowerToys Image Resizer utility</a> (learn more about it <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">here)</a>.</li></ul><p>When resizing, the recommended setting is "Large" (fits within 1920 x 1080 pixels).&nbsp;</p><p><strong>After inserting an image</strong></p><ul><li data-list-item-id="e947861b5df00b7ae13cdf5b05be9f5c2"><strong>In the text field:</strong> Click the image to access options for adjusting its size and alignment.</li><li data-list-item-id="e5d7eae813b265c8dab63c0f4994d3e89"><strong>In "Summary for home page":</strong> Click the image to set its alignment. The size cannot be adjusted.&nbsp;</li></ul>'
    format: basic_html
field_type: markup
