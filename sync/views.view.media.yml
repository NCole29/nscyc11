          content: "<details>\r\n<summary>Information about Files and Media</summary>\r\n<p>All uploaded items appear in two places under the <strong>Content</strong> tab:  </p>\r\n<ul>\r\n<li><strong>Files:</strong> Use this list to identify and delete \"orphaned\" files (used in 0 places) that are no longer needed.</li>\r\n<li><strong>Media:</strong> Displays items used on the website.  Most filenames are replaced by the \"alternative text\" entered during upload. Click a media name to view its original filename.\r\n</ul><br>\r\n<strong>Deleting Items</strong>\r\n<ul>\r\n<li><strong>Files:</strong> The status changes to \"temporary\" and the file is deleted during the next scheduled cleanup (every 6 hours)..</li>\r\n<li><strong>Media:</strong> The file is immediately deleted from the server and the database. <strong>Important:</strong> If you delete an image embedded in a text field, you must manually remove the resulting broken link.</li> \r\n</ul>\r\n<hr>\r\n</details>\r\n"
