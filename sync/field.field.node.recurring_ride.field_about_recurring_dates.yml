settings:
  markup:
    value: '<p><strong>Start date/time:</strong> The ride page displays the start date and time. The end time is hidden unless changed to differ from the start.</p><p><strong>Assigning different start times to different dates?&nbsp;</strong> Save the ride to generate the series of dates in the database. Then edit the ride and click <strong>MANAGE INSTANCES</strong> to <strong>Override </strong>and change the time for specific dates.</p><p><strong>Excluding specific dates from the series?&nbsp;</strong> After saving and editing the ride, click <strong>MANAGE INSTANCES</strong> to <strong>Remove instance </strong>for specific dates.&nbsp;</p><p>If a date recurrence does not fit standard frequency rules (WEEKLY or MONTHLY intervals), do not create a separate ride page for each date. Instead, use this workaround:</p><ol><li data-list-item-id="e394bf564dde72f6f211712cc6c41f530">Select the standard rule that closest matches your schedule.</li><li data-list-item-id="e5f470a7f20e81faec67c1c225d945496">Use <strong>MANAGE INSTANCES</strong> to manually adjust and remove dates.&nbsp;</li><li data-list-item-id="e6aa8fb5d8b4cf54f70fb328ec161223e">Enter the details of your custom schedule in the provided text field.</li></ol><p>Example: For a ride that occurs on the 1st and 3rd Friday of the month, set the rule to every 2 weeks and use MANAGE INSTANCES to revise dates. Enter "1st and 3rd Friday of the month" as the <strong>Custom repeat rule.</strong></p><p>&nbsp;</p>'
    format: basic_html
field_type: markup
