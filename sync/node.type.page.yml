description: "<em>Basic pages</em> may be simple text or complex layouts using sections, callouts, cards, and images. You can optionally include a banner or gallery of images above the page title, or restrict access to Members or Administrators. Because these pages are not automatically linked, you must manually add them to a menu or link to them from another page.\r\n<p>Note that basic pages lack a \"Summary for Home page\" field; you should use blocks to place permanent content on the home page.</p>\r\n"
