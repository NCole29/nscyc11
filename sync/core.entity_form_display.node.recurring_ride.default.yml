      weight: 8
      format_type: details
      format_settings:
        classes: ''
        show_empty_fields: false
        id: ''
        open: false
        description: "Help keep the Master ride list clean of duplicates!<br>\r\nIf adding a new ride (not cloning a ride), please code if its a \"master ride\" or variation of an existing ride.<br>Variations have slightly different routes, or they start from a different place along the route.\r\n "
        required_fields: true
    group_ride_picture:
