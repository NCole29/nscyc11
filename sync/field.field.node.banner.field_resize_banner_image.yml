settings:
  markup:
    value: '<p>The maximum image file size is <strong>5MB</strong> for banner images and <strong>2MB</strong> for gallery images. Uploading larger files is unnecessary because images are resized automatically for optimal display across various devices.</p><p>Consider the following tools to resize your images before uploading:</p><ul><li data-list-item-id="e89df0abbfbba41a7a0a93190a9a5870e"><strong>Mac Users</strong> - Utilize&nbsp;<a href="https://support.apple.com/guide/preview/crop-resize-or-rotate-an-image-prvw2015/mac#:~:text=Reduce%20an%20image&amp;apos;s%20file%20size,value%20in%20the%20Resolution%20field.">Apple''s built-in Preview application</a>.</li><li data-list-item-id="ee93a32549204fd979a2ef1b7bb3365c6"><strong>Windows Users&nbsp;</strong>– Install and use the&nbsp;<a href="https://apps.microsoft.com/detail/xp89dcgq3k6vld?hl=en-US&amp;gl=US">Microsoft PowerToys Image Resizer</a>&nbsp;utility (learn more about it&nbsp;<a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">here)</a>.</li></ul><p>When resizing, the recommended settings are:</p><ul><li data-list-item-id="e531660a9769773d6eec22dbe798d48c6">Banner images - "For web" (fits within 2500 x 1875 pixels)</li><li data-list-item-id="e666f4ffdbc5c4e76db2c179683165f39">Gallery images - "Large" (fits within 1920 x 1080 pixels)</li></ul>'
    format: basic_html
field_type: markup
