settings:
  markup:
    value: '<p>There are <strong>two </strong>ways to add images to an <strong>Announcement </strong>page:</p><ol><li data-list-item-id="e8d39581727e3ce3848366aa7efd7178b"><strong>Image </strong>field displays a standard-sized image in two locations:<ul><li data-list-item-id="e338c5441eab2a2d899b61b0604e8d939">The home page above the “Summary for home page.”</li><li data-list-item-id="ed6955ba7bc581814f3bb6286e5a740b6">The Announcement page.</li></ul></li><li class="ck-list-marker-bold" data-list-item-id="e9b9304431cda745648b306eea63c616c"><strong>Text field&nbsp;</strong><ul><li data-list-item-id="ec3a68227326bcd74b225ae017e794e05">You can insert images directly into the text editor by clicking the <strong>Insert Media</strong> icon. Once the image is placed, click on it to adjust its size, alignment, and text-wrap settings.</li></ul></li></ol><p>The maximum image file size is <strong>2MB.&nbsp;</strong>Uploading larger files is unnecessary because images are resized automatically for optimal display across various devices.</p><p>Consider the following tools to resize images that are larger than 3MB:</p><ul><li data-list-item-id="ec1cba1fa74cb6c214f934db69abd261d"><strong>Mac Users&nbsp;</strong>- Utilize <a href="https://support.apple.com/guide/preview/crop-resize-or-rotate-an-image-prvw2015/mac#:~:text=Reduce%20an%20image&amp;apos;s%20file%20size,value%20in%20the%20Resolution%20field.">Apple''s built-in Preview application</a>.</li><li data-list-item-id="ee6dbbccd98b915c7e2480e4171987136"><strong>Windows Users&nbsp;</strong>- Install and use the <a href="https://apps.microsoft.com/detail/xp89dcgq3k6vld?hl=en-US&amp;gl=US">Microsoft PowerToys Image Resizer utility</a> (learn more about it <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">here)</a>.</li></ul><p>When resizing, the recommended setting is "Large" (fits within 1920 x 1080 pixels).&nbsp;</p><p>&nbsp;</p>'
    format: basic_html
field_type: markup
