settings:
  markup:
    value: '<p><strong>Use the image field</strong> to display a standard-sized image on the Webform page and above the “Summary" on the home page.</p><ol><li data-list-item-id="eab3ea5d8be9b91a7c6df127d4a95be98"><strong>Add media</strong> and search the library or upload a new file.&nbsp;</li><li data-list-item-id="e98f27213ff0a826f2c805f8c3b792618"><strong>Add Alternative Text</strong> -<strong> </strong>This<strong> </strong>descriptive text is displayed under images in the library and makes images searchable.</li><li data-list-item-id="ef41435118ab16ca84c7fe2eb16b4a859"><strong>Adjust the focal point and Preview</strong> - Images display in a 16:9 aspect ratio, so uploaded images may be automatically cropped. Move the crosshairs on your uploaded image to choose the focal point. Click Preview to see the cropped version, and adjust the crosshairs if needed. If you need to adjust the focal point after saving, go to <a href="/admin/content/media">Content &gt; Media</a> to edit the image; do not upload the file again.</li><li data-list-item-id="e52ec17a71ac4e8056d099a7d351c0d16"><strong>File size</strong> - Please ensure your image is at least 750 x 422 pixels and under 2MB. Images are automatically optimized for display, so larger files are not necessary.</li><li data-list-item-id="ea225a3890bc31816a3fbe28c5a0154cc"><strong>Need to resize?</strong> If your file is larger than 2MB, use Apple Preview (Mac) or <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">Microsoft PowerToys Image Resizer</a> (Windows) to resize images before uploading to no larger than "Large" (up to 1920x1080 pixels).</li></ol><p>There are two more ways to add images to a Webform page:</p><ol><li data-list-item-id="e81ae8311068e5ab27b354590e4ee4ff2">In the <strong>Text editor</strong>, use the <strong>Insert media</strong> icon. Once the image is placed, click on it to adjust its size, alignment, and text-wrap settings.</li><li data-list-item-id="ecd2d1f67916ed5e11ea840b3c13e9c50">Go to the <strong>Banner image </strong>tab to add images for display across the page width above the page title.</li></ol>'
    format: basic_html
field_type: markup
