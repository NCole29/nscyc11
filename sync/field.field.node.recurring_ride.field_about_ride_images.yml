settings:
  markup:
    value: '<p><strong>Add media</strong> and search the library or upload a new file.&nbsp;</p><p><strong>Add Alternative Text</strong> -<strong> </strong>This descriptive text is displayed under images in the library and makes images searchable.</p><p><strong>Adjust the focal point and Preview</strong> - Ride images display in a 16:9 aspect ratio, so uploaded images may be automatically cropped. Move the crosshairs on your uploaded image to choose the focal point. Click Preview to see the cropped version, and adjust the crosshairs if needed. If you need to adjust the focal point after saving, go to <a href="/admin/content/media">Content &gt; Media</a> to edit the image; do not upload the file again.</p><p><strong>File size</strong> - Please ensure your image is at least 750 x 422 pixels and under 2MB. Images are automatically optimized for display, so larger files are not necessary.</p><p><strong>Need to resize?</strong> If your file is larger than 2MB, use Apple Preview (Mac) or <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">Microsoft PowerToys Image Resizer</a> (Windows) to resize images before uploading to no larger than "Large" (up to 1920x1080 pixels).</p>'
    format: basic_html
field_type: markup
