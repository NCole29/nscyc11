id: contact_us
title: 'Contact Us'
description: '<p>Send mail to nscyc.org mailboxes.</p>'
categories:
  - User
elements: |-
  id:
    '#type': hidden
    '#title': 'Topic ID'
    '#default_value': '[current-page:query:id]'
  markup:
    '#type': webform_markup
    '#states':
      invisible:
        ':input[name="id"]':
          value: '0'
    '#markup': '<h3>Have a question?</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(0, 0, 0);font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;outline:none;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Your message will be forwarded directly to one or more of our club leaders. &nbsp;<span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Are you a new member? Check out the </span><a style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-radius:0px;box-sizing:border-box;color:rgb(21, 82, 149);font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;outline:none;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;transition:0.4s;white-space:normal;widows:2;word-spacing:0px;" href="https://nscyc.ddev.site/first-time-nsc-riders-qa">First-time NSC Riders Q&amp;A</a><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"> page.</span></p>'
  treasurer:
    '#type': webform_message
    '#states':
      visible:
        ':input[name="to"]':
          value: '63'
    '#message_message': '<p>Ride leaders: This form does not accept attachments. Please send receipts and ride reimbursement forms to <a href="mailto:treasurer@nscyc.org">treasurer@nscyc.org</a> from your email.&nbsp;</p>'
  to:
    '#type': webform_entity_select
    '#title': To
    '#required': true
    '#default_value': '[current-page:query:mail_to]'
    '#attributes':
      style: 'border: 1px solid #C0C0C0;'
    '#target_type': taxonomy_term
    '#selection_handler': views
    '#selection_settings':
      view:
        view_name: club_taxonomies
        display_name: mailboxes
        arguments:
          - '[current-page:query:mail_to]'
  name:
    '#type': textfield
    '#title': 'Your name'
    '#size': 25
    '#required': true
    '#default_value': '[current-user:display-name]'
    '#attributes':
      style: 'background-color: #edf4fc;border: 1px solid #C0C0C0;'
  email:
    '#type': email
    '#title': 'Your email'
    '#size': 30
    '#required': true
    '#default_value': '[current-user:mail]'
    '#attributes':
      style: 'background-color: #edf4fc;border: 1px solid #C0C0C0;'
  subject:
    '#type': textfield
    '#title': Subject
    '#required': true
    '#attributes':
      style: 'background-color: #edf4fc;border: 1px solid #C0C0C0;'
    '#test': 'Testing contact webform from [site:name]'
  message:
    '#type': textarea
    '#title': Message
    '#required': true
    '#attributes':
      style: 'background-color: #edf4fc;border: thin solid #C0C0C0;'
    '#test': 'Please ignore this email.'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Send message'
