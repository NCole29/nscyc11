settings:
  markup:
    value: '<p><strong>Select or Upload Media - </strong>Click <strong>Add media</strong> to select an existing image from the library or upload a new file.&nbsp;</p><p><strong>Add Alternative Text</strong> -<strong> </strong>When uploading, include a descriptive <strong>Alternative text</strong>. This is displayed under images in the library and makes images searchable.</p><p><strong>Crop and Frame the Image</strong> - Click <strong>Crop image</strong> to ensure a consistent, standard look across all ride pages. You can manually adjust the framing box if needed.</p><p><strong>File size</strong> - The size limit is 2MB. Images are automatically optimized for display, so larger files are not necessary.</p><p><strong>Need to resize?</strong> If your file is too big, use Apple Preview (Mac) or <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">Microsoft PowerToys Image Resizer</a> (Windows) to resize images before uploading to no larger than "Large" (up to 1920x1080 pixels).</p>'
    format: basic_html
