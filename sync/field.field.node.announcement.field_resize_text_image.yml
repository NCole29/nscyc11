settings:
  markup:
    value: '<p><strong>Use the image field</strong> to display a standard-sized image above the “Summary for home page” and on the Announcement page.</p><ol><li data-list-item-id="ea5b29faabf472fdfc9eb81861d29beaf"><strong>Add media</strong> and search the library or upload a new file.&nbsp;</li><li data-list-item-id="e0c099a8fd344f4e518d4c41361ffd0d5"><strong>Add Alternative Text</strong> -<strong> </strong>This descriptive text is displayed under images in the library and makes images searchable.</li><li data-list-item-id="e2a3d4f08450a7f2207b0c3d2920f37b1"><strong>Adjust the focal point and Preview</strong> - Images display in a 16:9 aspect ratio, so uploaded images may be automatically cropped. Move the crosshairs on your uploaded image to choose the focal point. Click Preview to see the cropped version, and adjust the crosshairs if needed. If you need to adjust the focal point after saving, go to <a href="/admin/content/media">Content &gt; Media</a> to edit the image; do not upload the file again.</li><li data-list-item-id="ec7d6a217b7ecbc683ef7be33193ef5b6"><strong>File size</strong> - Please ensure your image is at least 750 x 422 pixels and under 2MB. Images are automatically optimized for display, so larger files are not necessary.</li><li data-list-item-id="ebef4e33ac4564716fcc8fbf092644a59"><strong>Need to resize?</strong> If your file is larger than 2MB, use Apple Preview (Mac) or <a href="https://learn.microsoft.com/en-us/windows/powertoys/image-resizer">Microsoft PowerToys Image Resizer</a> (Windows) to resize images before uploading to no larger than "Large" (up to 1920x1080 pixels).</li></ol><p>In the <strong>Text editor</strong>, use the <strong>Insert media</strong> icon to insert an image in the editor. Once the image is placed, click on it to adjust its size, alignment, and text-wrap settings.</p>'
    format: basic_html
field_type: markup
